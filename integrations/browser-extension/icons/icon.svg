<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">小窗刷题网课伴侣</title>
  <defs>
    <linearGradient id="bg" x1="16" y1="8" x2="114" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5367e8"/>
      <stop offset="1" stop-color="#263da7"/>
    </linearGradient>
    <clipPath id="portrait"><rect x="12" y="12" width="104" height="104" rx="23"/></clipPath>

name: Build and release QuizPane

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      test_windows_only:
        description: "仅构建 Windows 测试包（不发布 Release）"
        required: false
        default: false
        type: boolean
      test_extension_only:
        description: "仅构建浏览器扩展测试包（不发布 Release）"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  QT_VERSION: "6.5.3"

jobs:
  macos:
    if: ${{ !inputs.test_windows_only && !inputs.test_extension_only }}
    name: macOS ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple-Silicon
            runner: macos-14
            arch: arm64
          - name: Intel
            runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Verify runner architecture
        run: test "$(uname -m)" = "${{ matrix.arch }}"

      - name: Install build tools
        run: brew install cmake ninja dylibbundler tesseract tesseract-lang

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: clang_64
          # Qt5Compat provides QTextCodec/GB18030 fallback; QtPdf is used by
          # the document extractor; QtWebEngine renders supported web content.
          modules: qt5compat qtpdf qtwebengine qtwebsockets
          cache: true

      - name: Verify Qt WebSockets
        run: test -f "$QT_ROOT_DIR/lib/cmake/Qt6WebSockets/Qt6WebSocketsConfig.cmake"

      - name: Build, test and package QuizPane
        env:
          QT_PREFIX: ${{ env.QT_ROOT_DIR }}
          SIGN_IDENTITY: "-"
        run: ./scripts/build-macos.sh

      - name: Prepare portable release assets
        run: |
          mkdir -p release-assets
          cp "dist/macos/QuizPane-macos-${{ matrix.arch }}.dmg" \
            "release-assets/QuizPane-macos-${{ matrix.arch }}.dmg"
          cd release-assets
          shasum -a 256 * > "SHA256SUMS-macos-${{ matrix.arch }}.txt"

      - name: Upload macOS packages
        uses: actions/upload-artifact@v7
        with:
          name: release-macos-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error

  windows:
    if: ${{ !inputs.test_extension_only }}
    name: Windows 10 and 11 x64
    runs-on: windows-2022
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Prepare vcpkg binary cache
        id: vcpkg_cache
        shell: pwsh
        run: |
          $Revision = (& git -C $env:VCPKG_INSTALLATION_ROOT rev-parse HEAD).Trim()
          "revision=$Revision" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/vcpkg-binary-cache" | Out-Null

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg_cache.outputs.revision }}-x64-windows-static-md-tesseract-v1
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ runner.arch }}-

      - name: Install build tools
        shell: pwsh
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.temp }}/vcpkg-binary-cache
        run: |
          choco install cmake ninja -y --no-progress
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install tesseract:x64-windows-static-md

      - name: Download OCR language data
        shell: pwsh
        run: |
          $Tessdata = Join-Path $env:RUNNER_TEMP "tessdata"
          New-Item -ItemType Directory -Force $Tessdata | Out-Null
          Invoke-WebRequest https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/chi_sim.traineddata -OutFile (Join-Path $Tessdata "chi_sim.traineddata")
          Invoke-WebRequest https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/eng.traineddata -OutFile (Join-Path $Tessdata "eng.traineddata")
          "TESSDATA_DIR=$Tessdata" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2019_64
          modules: qt5compat qtpdf qtwebengine qtwebsockets
          cache: true

      - name: Verify Qt WebSockets
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:QT_ROOT_DIR/lib/cmake/Qt6WebSockets/Qt6WebSocketsConfig.cmake")) {
            throw "Qt WebSockets module was not installed"
          }

      - name: Build, test and package QuizPane
        shell: pwsh
        run: |
          if ("${{ inputs.test_windows_only }}" -eq "true") {
            ./scripts/build-windows.ps1 -QtRoot "$env:QT_ROOT_DIR" `
              -CMakeToolchainFile "$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
              -VcpkgTargetTriplet "x64-windows-static-md" `
              -EnableDiagnosticLogging
          } else {
            ./scripts/build-windows.ps1 -QtRoot "$env:QT_ROOT_DIR" `
              -CMakeToolchainFile "$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
              -VcpkgTargetTriplet "x64-windows-static-md"
          }

      - name: Inspect Windows portable ZIP
        shell: pwsh
        run: |
          $Archive = "dist/windows/QuizPane-windows-x64-portable.zip"
          $Inspect = Join-Path $env:RUNNER_TEMP "quizpane-windows-inspect"
          Expand-Archive -Path $Archive -DestinationPath $Inspect -Force
          $Root = Join-Path $Inspect "QuizPane"
          foreach ($File in @(
            "小窗刷题.exe", "题库制作器.exe",
            "Qt6Core.dll", "Qt6Network.dll", "Qt6Pdf.dll", "Qt6WebSockets.dll",
            "MSVCP140.dll", "MSVCP140_1.dll", "MSVCP140_2.dll",
            "VCRUNTIME140.dll", "VCRUNTIME140_1.dll",
            "platforms/qwindows.dll", "tls/qschannelbackend.dll",
            "tessdata/chi_sim.traineddata", "tessdata/eng.traineddata"
          )) {
            if (-not (Test-Path (Join-Path $Root $File))) { throw "Windows ZIP missing $File" }
          }
          foreach ($Forbidden in @("windows_tls_runtime_probe.exe", "document_extractor_test.exe", "vc_redist.x64.exe")) {
            if (Test-Path (Join-Path $Root $Forbidden)) { throw "Windows ZIP contains forbidden executable: $Forbidden" }
          }

      - name: Prepare checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item "dist/windows/QuizPane-windows-x64-portable.zip" release-assets/
          Get-ChildItem release-assets/*.zip | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Add-Content release-assets/SHA256SUMS-windows-x64.txt
          }

      - name: Upload Windows packages
        uses: actions/upload-artifact@v7
        with:
          # 手工测试构建只保留为 Artifact，不会使用正式版本号或创建 Release。
          name: ${{ inputs.test_windows_only && format('QuizPane-windows-x64-test-{0}', github.sha) || 'release-windows-x64' }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  windows7:
    if: ${{ !inputs.test_extension_only }}
    name: Windows 7 ${{ matrix.arch }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            qt_arch: win64_msvc2019_64
            qtpdf_package: win64_msvc2019_64
            qtpdf_archive: 5.15.2-0-202011130602qtwebengine-Windows-Windows_10-MSVC2019-Windows-Windows_10-X86_64.7z
            qtpdf_marker: 5.15.2/msvc2019_64/
          - arch: x86
            qt_arch: win32_msvc2019
            qtpdf_package: win32_msvc2019
            qtpdf_archive: 5.15.2-0-202011130602qtwebengine-Windows-Windows_10-MSVC2019-Windows-Windows_10-X86.7z
            qtpdf_marker: 5.15.2/msvc2019/
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Configure MSVC 2019 toolset
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}
          toolset: 14.29

      - name: Install Qt 5.15
        uses: jurplel/install-qt-action@v4
        with:
          version: "5.15.2"
          arch: ${{ matrix.qt_arch }}
          cache: true

      # Qt 5.15.2 官方 Windows 预编译包不含独立 QtPdf；从官方 qtwebengine
      # 包中只提取 Qt5Pdf DLL/导入库，头文件使用仓库 vendored 副本。
      - name: Install Qt 5.15 QtPdf binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $Url = "https://download.qt.io/online/qtsdkrepository/windows_x86/desktop/qt5_5152/qt.qt5.5152.qtwebengine.${{ matrix.qtpdf_package }}/${{ matrix.qtpdf_archive }}"
          $Archive = Join-Path $env:RUNNER_TEMP "qtwebengine.7z"
          Invoke-WebRequest -Uri $Url -OutFile $Archive
          pip install "py7zr==0.22.0"
          $env:QTPDF_ARCHIVE = $Archive
          $env:QTPDF_MARKER = "${{ matrix.qtpdf_marker }}"
          @'
          import os, sys, py7zr, shutil, tempfile
          root = os.environ['QT_ROOT_DIR']
          archive = os.environ['QTPDF_ARCHIVE']
          marker = os.environ['QTPDF_MARKER']
          with py7zr.SevenZipFile(archive) as z:
              names = z.getnames()
          targets = [n for n in names
                     if marker in n
                     and os.path.basename(n).startswith('Qt5Pdf')]
          if not targets:
              print('no Qt5Pdf files found in archive')
              sys.exit(1)
          tmp = tempfile.mkdtemp()
          with py7zr.SevenZipFile(archive) as z:
              z.extract(targets=targets, path=tmp)
          wanted = []
          for name in targets:
              rel = name[name.find(marker) + len(marker):]
              if not rel:
                  continue
              src = os.path.join(tmp, name)
              dest = os.path.join(root, rel.replace('/', os.sep))
              os.makedirs(os.path.dirname(dest), exist_ok=True)
              shutil.move(src, dest)
              wanted.append(rel)
          shutil.rmtree(tmp, ignore_errors=True)
          if 'lib/Qt5Pdf.lib' not in wanted or 'bin/Qt5Pdf.dll' not in wanted:
              sys.exit(1)
          '@ | Set-Content -Path "$env:RUNNER_TEMP\extract_qtpdf.py" -Encoding UTF8
          python "$env:RUNNER_TEMP\extract_qtpdf.py"
          if ($LASTEXITCODE -ne 0) { throw "Qt5Pdf extraction failed" }

      - name: Verify Qt 5 modules
        shell: pwsh
        run: |
          $WebSockets = Join-Path "$env:QT_ROOT_DIR/lib/cmake" "Qt5WebSockets/Qt5WebSocketsConfig.cmake"
          if (-not (Test-Path $WebSockets)) { throw "Missing Qt5 WebSockets module" }
          foreach ($RelativePath in @("lib/Qt5Pdf.lib", "bin/Qt5Pdf.dll")) {
            if (-not (Test-Path (Join-Path $env:QT_ROOT_DIR $RelativePath))) {
              throw "Missing $RelativePath"
            }
          }

      - name: Cache Win7 OpenSSL runtime
        uses: actions/cache@v4
        with:
          path: build/windows7-openssl-${{ matrix.arch }}/runtime
          key: win7-openssl-1.1.1w-v142-${{ matrix.arch }}-${{ hashFiles('scripts/build-windows7-openssl.ps1') }}

      - name: Build, test and package Win7
        shell: pwsh
        run: ./scripts/build-windows7.ps1 -QtRoot "$env:QT_ROOT_DIR" -Architecture ${{ matrix.arch }}

      - name: Inspect portable ZIP
        shell: pwsh
        run: |
          $Archive = "dist/windows7/QuizPane-windows7-${{ matrix.arch }}-portable.zip"
          if (-not (Test-Path $Archive)) { throw "Windows 7 archive was not created" }
          $Inspect = Join-Path $env:RUNNER_TEMP "quizpane-windows7-inspect"
          Expand-Archive -Path $Archive -DestinationPath $Inspect -Force
          $Root = Join-Path $Inspect "QuizPane"
          $OpenSslSuffix = if ("${{ matrix.arch }}" -eq "x64") { "-x64" } else { "" }
          $Required = @(
            "QuizPane.exe", "QuizPaneStudio.exe", "Qt5Core.dll", "Qt5Gui.dll",
            "Qt5Network.dll", "Qt5Pdf.dll", "Qt5WebSockets.dll", "Qt5Widgets.dll",
            "libcrypto-1_1$OpenSslSuffix.dll", "libssl-1_1$OpenSslSuffix.dll",
            "licenses/OpenSSL-1.1.1w.txt",
            "MSVCP140.dll", "VCRUNTIME140.dll", "ucrtbase.dll",
            "api-ms-win-crt-runtime-l1-1-0.dll", "platforms/qwindows.dll"
          )
          foreach ($RelativePath in $Required) {
            if (-not (Test-Path (Join-Path $Root $RelativePath))) {
              throw "Missing packaged runtime file: $RelativePath"
            }
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $Zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $Archive))
          try {
            $NonAsciiEntries = @($Zip.Entries | Where-Object { $_.FullName -match '[^\x00-\x7F]' } | ForEach-Object FullName)
          } finally {
            $Zip.Dispose()
          }
          if ($NonAsciiEntries.Count -gt 0) {
            throw "Windows 7 package contains non-ASCII paths: $($NonAsciiEntries -join ', ')"
          }
          if (Get-ChildItem $Root -Recurse -Filter "Qt6*.dll") {
            throw "Windows 7 package unexpectedly contains Qt 6 DLLs"
          }

      - name: Prepare checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item "dist/windows7/QuizPane-windows7-${{ matrix.arch }}-portable.zip" release-assets/
          Get-ChildItem release-assets/*.zip | ForEach-Object {
            $Hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$Hash  $($_.Name)" | Add-Content release-assets/SHA256SUMS-windows7-${{ matrix.arch }}.txt
          }

      - name: Upload Windows 7 packages
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.test_windows_only && format('QuizPane-windows7-{0}-test-{1}', matrix.arch, github.sha) || format('release-windows7-{0}', matrix.arch) }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  linux:
    if: ${{ !inputs.test_windows_only && !inputs.test_extension_only }}
    name: Linux x64 (UOS and Kylin compatible)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Install build and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build imagemagick libgl1 libegl1 libx11-dev \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 libtesseract-dev \
            tesseract-ocr-chi-sim tesseract-ocr-eng xz-utils

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: gcc_64
          modules: qt5compat qtpdf qtwebengine qtwebsockets
          cache: true

      - name: Verify Qt WebSockets
        run: test -f "$QT_ROOT_DIR/lib/cmake/Qt6WebSockets/Qt6WebSocketsConfig.cmake"

      - name: Install Linux deployment tool
        run: |
          mkdir -p "$RUNNER_TEMP/linuxdeploy"
          curl -L --fail --retry 3 \
            -o "$RUNNER_TEMP/linuxdeploy/linuxdeploy" \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -L --fail --retry 3 \
            -o "$RUNNER_TEMP/linuxdeploy/linuxdeploy-plugin-qt" \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/linuxdeploy/"*
          echo "$RUNNER_TEMP/linuxdeploy" >> "$GITHUB_PATH"

      - name: Build, test and package QuizPane
        env:
          QT_PREFIX: ${{ env.QT_ROOT_DIR }}
          DISTRO_ID: linux
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: ./scripts/build-uos.sh

      - name: Prepare checksums
        run: |
          mkdir -p release-assets
          cp dist/uos/QuizPane-linux-x86_64.tar.gz release-assets/
          cp dist/uos/QuizPane-linux-x86_64.tar.xz release-assets/
          cp dist/uos/QuizPane-linux-x86_64.deb release-assets/
          cd release-assets
          sha256sum * > SHA256SUMS-linux-x86_64.txt

      - name: Upload Linux packages
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-x64
          path: release-assets/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') && !inputs.test_windows_only && !inputs.test_extension_only
    needs: [macos, windows, windows7, linux, browser-extension]
    runs-on: ubuntu-22.04
    steps:
      - name: Download all platform packages
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "QuizPane ${GITHUB_REF_NAME}" \
            --generate-notes

  browser-extension:
    if: ${{ !inputs.test_windows_only }}
    name: Browser course companion
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Validate and package extension
        run: |
          jq empty integrations/browser-extension/manifest.json
          node --check integrations/browser-extension/src/service-worker.js
          node --check integrations/browser-extension/src/content-script.js
          node --check integrations/browser-extension/src/popup.js
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            bash scripts/package-extension.sh "${GITHUB_REF_NAME#v}"
          else
            bash scripts/package-extension.sh
          fi
          mkdir -p release-assets
          cp dist/quizpane-course-companion.zip \
            release-assets/QuizPane-course-companion.zip

      - name: Upload browser extension
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.test_extension_only && format('QuizPane-course-companion-test-{0}', github.sha) || 'release-browser-extension' }}
          path: release-assets/QuizPane-course-companion.zip
          if-no-files-found: error
          retention-days: 14

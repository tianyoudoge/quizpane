<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="1200" height="800" fill="#FFFFFF"/>
  <text x="600" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1A1A2E">小窗视频镜像（复杂版）· 触发链路与双平台后端</text>
  <text x="600" y="55" text-anchor="middle" font-size="12" fill="#6B7280">浏览器扩展 ⇄ BrowserBridge(WebSocket) ⇄ ExternalWindowManager ⇄ 平台后端；协议只传播放器状态与控制命令，不含网页内容/Cookie/视频地址</text>

  <defs>
    <marker id="w1" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#5B6472"/></marker>
    <marker id="w2" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#BE185D"/></marker>
  </defs>

  <!-- trigger chain top -->
  <rect x="40" y="76" width="1120" height="120" rx="10" fill="#FDEEF4" stroke="#F0A6C6"/>
  <text x="56" y="98" font-size="12.5" font-weight="700" fill="#BE185D">① 触发与状态同步链路</text>
  <g font-size="10.5" fill="#9D174D" text-anchor="middle">
    <rect x="60" y="112" width="220" height="66" rx="8" fill="#FFF" stroke="#F0A6C6"/><text x="170" y="136" font-weight="600">浏览器扩展</text><text x="170" y="154" font-size="9.5">检测 HTML5 播放器</text><text x="170" y="169" font-size="9.5">上报窗口 id / 播放状态</text>
    <rect x="330" y="112" width="240" height="66" rx="8" fill="#FFF" stroke="#F0A6C6"/><text x="450" y="132" font-weight="600">BrowserBridge :38427</text><text x="450" y="150" font-size="9.5">仅 IPv4 loopback · 16KB 上限</text><text x="450" y="165" font-size="9.5">parseMessage → BrowserStatus</text>
    <rect x="620" y="112" width="240" height="66" rx="8" fill="#FFF" stroke="#7CA6F5"/><text x="740" y="132" font-weight="600" fill="#1E3A8A">MainWindow</text><text x="740" y="150" font-size="9.5" fill="#5573A8">updateCourseCompanion</text><text x="740" y="165" font-size="9.5" fill="#5573A8">课程陪伴页 / 视频状态条</text>
    <rect x="910" y="112" width="230" height="66" rx="8" fill="#FFF" stroke="#7CA6F5"/><text x="1025" y="132" font-weight="600" fill="#1E3A8A">ExternalWindowManager</text><text x="1025" y="150" font-size="9.5" fill="#5573A8">attach(AttachRequest)</text><text x="1025" y="165" font-size="9.5" fill="#5573A8">chromeWindowId / bounds / fps</text>
  </g>
  <g stroke="#BE185D" stroke-width="1.5" marker-end="url(#w2)">
    <line x1="280" y1="145" x2="326" y2="145"/>
    <line x1="570" y1="145" x2="616" y2="145"/>
    <line x1="860" y1="145" x2="906" y2="145"/>
  </g>

  <!-- state machine -->
  <rect x="40" y="210" width="1120" height="66" rx="10" fill="#FFF7E6" stroke="#F3C67C"/>
  <text x="56" y="232" font-size="12" font-weight="700" fill="#B45309">② 会话状态机（external_window::State，单向流转）</text>
  <text x="600" y="255" text-anchor="middle" font-size="11.5" fill="#B98A4A">Idle → ResolvingTarget → (Attached/Starting) → Active　｜　源窗口暂丢 → Recovering 自动重连　｜　Failed / Stopped 终态</text>

  <!-- macOS backend -->
  <rect x="40" y="292" width="550" height="420" rx="12" fill="#F1FBF6" stroke="#8EE0BC" stroke-width="1.5"/>
  <text x="56" y="316" font-size="14" font-weight="700" fill="#059669">③A macOS 后端 · MacCapturedReplica（.mm Objective-C++）</text>
  <g font-size="10.5" fill="#065F46">
    <rect x="60" y="330" width="510" height="60" rx="7" fill="#FFF" stroke="#5FD0A0"/><text x="72" y="350" font-weight="600">mac_window_replica_capture.mm</text><text x="72" y="368" font-size="9.5" fill="#5A9E82">CGWindowListCopyWindowInfo 按 windowId 定位源窗口</text><text x="72" y="383" font-size="9.5" fill="#5A9E82">SCStream 建立捕获·SCStreamConfiguration 逻辑点→实际像素换算</text>
    <rect x="60" y="398" width="510" height="52" rx="7" fill="#FFF" stroke="#5FD0A0"/><text x="72" y="418" font-weight="600">权限：requestScreenCapturePermission</text><text x="72" y="435" font-size="9.5" fill="#5A9E82">不信 CGPreflight 旧预检；真正发起 SCStream 才是权限结论</text>
    <rect x="60" y="458" width="510" height="52" rx="7" fill="#FFF" stroke="#5FD0A0"/><text x="72" y="478" font-weight="600">mac_window_replica_renderer.mm</text><text x="72" y="495" font-size="9.5" fill="#5A9E82">把捕获帧渲染到自己的置顶窗口（真正的画面镜像）</text>
    <rect x="60" y="518" width="510" height="52" rx="7" fill="#FFF" stroke="#5FD0A0"/><text x="72" y="538" font-weight="600">mac_window_replica_input.mm（可交互）</text><text x="72" y="555" font-size="9.5" fill="#5A9E82">镜像窗口手势 → videoControlRequested → 转发回扩展控制播放</text>
    <rect x="60" y="578" width="510" height="52" rx="7" fill="#FFF" stroke="#5FD0A0"/><text x="72" y="598" font-weight="600">异步生命周期防护</text><text x="72" y="615" font-size="9.5" fill="#5A9E82">首帧确认等回调可能在 detach 之后到达，需校验会话仍有效</text>
    <rect x="60" y="638" width="510" height="52" rx="7" fill="#FFF" stroke="#5FD0A0"/><text x="72" y="658" font-weight="600">restoreFrameReady</text><text x="72" y="675" font-size="9.5" fill="#5A9E82">老板键恢复时等一帧就绪再显示，避免露出黑屏</text>
  </g>

  <!-- Windows backend -->
  <rect x="610" y="292" width="550" height="420" rx="12" fill="#F5F9FF" stroke="#A8C7FA" stroke-width="1.5"/>
  <text x="626" y="316" font-size="14" font-weight="700" fill="#2563EB">③B Windows 后端 · WindowsNativeTopmost（Win32）</text>
  <g font-size="10.5" fill="#1E3A8A">
    <rect x="630" y="330" width="510" height="60" rx="7" fill="#FFF" stroke="#7CA6F5"/><text x="642" y="350" font-weight="600">目标定位 EnumWindows + findWindowCallback</text><text x="642" y="368" font-size="9.5" fill="#5573A8">按标题/类名匹配 Chromium popup·GetWindowThreadProcessId</text><text x="642" y="383" font-size="9.5" fill="#5573A8">manager 层 50ms 轮询重试至 2s（等 document.title 同步）</text>
    <rect x="630" y="398" width="510" height="52" rx="7" fill="#FFF" stroke="#7CA6F5"/><text x="642" y="418" font-weight="600">置顶 SetWindowPos(HWND_TOPMOST)</text><text x="642" y="435" font-size="9.5" fill="#5573A8">不复制画面·无需录屏权限·直接抬原生窗口 z-order</text>
    <rect x="630" y="458" width="510" height="52" rx="7" fill="#FFF" stroke="#7CA6F5"/><text x="642" y="478" font-weight="600">置顶校验 GetWindow(GW_HWNDPREV)</text><text x="642" y="495" font-size="9.5" fill="#5573A8">WS_EX_TOPMOST 只表带位；重走 z-order 才知是否真在最前</text>
    <rect x="630" y="518" width="510" height="52" rx="7" fill="#FFF" stroke="#7CA6F5"/><text x="642" y="538" font-weight="600">监听 SetWinEventHook</text><text x="642" y="555" font-size="9.5" fill="#5573A8">前台/对象事件回调 → 目标丢失 windows-topmost-target-lost</text>
    <rect x="630" y="578" width="510" height="52" rx="7" fill="#FFF" stroke="#7CA6F5"/><text x="642" y="598" font-weight="600">setVisible / detach</text><text x="642" y="615" font-size="9.5" fill="#5573A8">恢复时 HWND_NOTOPMOST 还原 z-order</text>
    <rect x="630" y="638" width="510" height="52" rx="7" fill="#FFF" stroke="#7CA6F5"/><text x="642" y="658" font-weight="600">局限</text><text x="642" y="675" font-size="9.5" fill="#5573A8">仅置顶不镜像：源窗口最小化则无内容可见（与 mac 策略差异）</text>
  </g>

  <!-- arrows -->
  <line x1="1025" y1="178" x2="1025" y2="208" stroke="#5B6472" stroke-width="1.6" marker-end="url(#w1)"/>
  <path d="M 300 276 L 300 290" stroke="#5B6472" stroke-width="1.6" marker-end="url(#w1)"/>
  <path d="M 880 276 L 880 290" stroke="#5B6472" stroke-width="1.6" marker-end="url(#w1)"/>
  <text x="470" y="288" font-size="9.5" fill="#5B6472">Q_OS_MACOS 编译期选择</text>
  <text x="1000" y="288" font-size="9.5" fill="#5B6472">Q_OS_WIN 编译期选择</text>
</svg>

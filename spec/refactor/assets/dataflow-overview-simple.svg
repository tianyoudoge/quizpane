<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 400" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="1080" height="400" fill="#FFFFFF"/>
  <text x="540" y="38" text-anchor="middle" font-size="23" font-weight="700" fill="#1A1A2E">全局数据流（简单版）</text>
  <text x="540" y="60" text-anchor="middle" font-size="12.5" fill="#6B7280">从原始资料到用户刷题的一条主链路</text>

  <defs><marker id="fa" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#2563EB"/></marker></defs>

  <!-- boxes -->
  <g>
    <rect x="40" y="150" width="150" height="90" rx="10" fill="#FEF3E2" stroke="#F7CE8A"/>
    <text x="115" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#B45309">① 原始资料</text>
    <text x="115" y="204" text-anchor="middle" font-size="10.5" fill="#B98A4A">txt/docx/pdf</text>
    <text x="115" y="220" text-anchor="middle" font-size="10.5" fill="#B98A4A">+ 可选答案册</text>

    <rect x="240" y="150" width="160" height="90" rx="10" fill="#E4F7EE" stroke="#5FD0A0"/>
    <text x="320" y="178" text-anchor="middle" font-size="13" font-weight="700" fill="#065F46">② 制作端</text>
    <text x="320" y="199" text-anchor="middle" font-size="10.5" fill="#5A9E82">提取→规则解析</text>
    <text x="320" y="215" text-anchor="middle" font-size="10.5" fill="#5A9E82">→人工复核</text>
    <text x="320" y="231" text-anchor="middle" font-size="9.5" fill="#8CBBA6">bank-studio</text>

    <rect x="450" y="150" width="160" height="90" rx="10" fill="#FEF3E2" stroke="#F7CE8A"/>
    <text x="530" y="178" text-anchor="middle" font-size="13" font-weight="700" fill="#B45309">③ 题库包</text>
    <text x="530" y="199" text-anchor="middle" font-size="10.5" fill="#B98A4A">.quizpane-provider</text>
    <text x="530" y="215" text-anchor="middle" font-size="10.5" fill="#B98A4A">bank.json+assets</text>
    <text x="530" y="231" text-anchor="middle" font-size="9.5" fill="#C9A45E">安装到本地</text>

    <rect x="660" y="150" width="160" height="90" rx="10" fill="#F0EBFE" stroke="#B29CF3"/>
    <text x="740" y="178" text-anchor="middle" font-size="13" font-weight="700" fill="#4C1D95">④ 题库运行时</text>
    <text x="740" y="199" text-anchor="middle" font-size="10.5" fill="#8B7BC4">DeclarativeProvider</text>
    <text x="740" y="215" text-anchor="middle" font-size="10.5" fill="#8B7BC4">JSON-RPC 应答</text>
    <text x="740" y="231" text-anchor="middle" font-size="9.5" fill="#A99AD0">组卷/判分</text>

    <rect x="870" y="150" width="160" height="90" rx="10" fill="#E7F0FE" stroke="#7CA6F5"/>
    <text x="950" y="178" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A8A">⑤ 刷题端</text>
    <text x="950" y="199" text-anchor="middle" font-size="10.5" fill="#5573A8">MainWindow 小窗</text>
    <text x="950" y="215" text-anchor="middle" font-size="10.5" fill="#5573A8">做题→交卷→解析</text>
    <text x="950" y="231" text-anchor="middle" font-size="9.5" fill="#8AA3C8">草稿自动保存</text>
  </g>

  <!-- arrows -->
  <g stroke="#2563EB" stroke-width="2" marker-end="url(#fa)">
    <line x1="190" y1="195" x2="236" y2="195"/>
    <line x1="400" y1="195" x2="446" y2="195"/>
    <line x1="610" y1="195" x2="656" y2="195"/>
    <line x1="820" y1="195" x2="866" y2="195"/>
  </g>

  <!-- labels on arrows -->
  <g font-size="10" fill="#2563EB" text-anchor="middle">
    <text x="213" y="186">导入</text>
    <text x="423" y="186">打包</text>
    <text x="633" y="186">加载</text>
    <text x="843" y="186">RPC</text>
  </g>

  <!-- feedback loop draft -->
  <path d="M 950 240 L 950 300 L 740 300 L 740 240" stroke="#7C3AED" stroke-width="1.6" stroke-dasharray="5 3" fill="none" marker-end="url(#fa)"/>
  <text x="845" y="318" text-anchor="middle" font-size="10.5" fill="#7C3AED">做题历史 QSettings 回写 · 影响下次组卷（掌握度过滤）</text>

  <text x="540" y="372" text-anchor="middle" font-size="11.5" fill="#9AA3AF">详细分链路见 dataflow-*-complex.svg：做题 / 规则识别 / MinerU识别 / 接口题库 / 小窗视频</text>
</svg>

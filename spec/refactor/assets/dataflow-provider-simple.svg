<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="900" height="480" fill="#FFFFFF"/>
  <text x="450" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1A1A2E">接口类题库（插件）实现（简单版）</text>
  <text x="450" y="56" text-anchor="middle" font-size="12" fill="#6B7280">Host 与 Provider 用 C ABI + JSON 通信，像"进程内的 HTTP/RPC"</text>

  <defs><marker id="pa" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#5B6472"/></marker></defs>

  <!-- Host -->
  <rect x="60" y="110" width="300" height="280" rx="12" fill="#E7F0FE" stroke="#7CA6F5"/>
  <text x="210" y="136" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A8A">Host（刷题端）</text>
  <rect x="90" y="156" width="240" height="60" rx="8" fill="#FFF" stroke="#7CA6F5"/>
  <text x="210" y="181" text-anchor="middle" font-size="12" font-weight="600" fill="#1E3A8A">ProviderLoader</text>
  <text x="210" y="199" text-anchor="middle" font-size="10" fill="#5573A8">解析导出符号·收发 JSON</text>
  <rect x="90" y="230" width="240" height="60" rx="8" fill="#FFF" stroke="#B29CF3"/>
  <text x="210" y="255" text-anchor="middle" font-size="12" font-weight="600" fill="#4C1D95">Host 能力表 qp_host_api_v1</text>
  <text x="210" y="273" text-anchor="middle" font-size="10" fill="#8B7BC4">log · secure_read/write/delete</text>
  <rect x="90" y="304" width="240" height="60" rx="8" fill="#FFF" stroke="#5FD0A0"/>
  <text x="210" y="329" text-anchor="middle" font-size="12" font-weight="600" fill="#065F46">SecretStore（凭据）</text>
  <text x="210" y="347" text-anchor="middle" font-size="10" fill="#5A9E82">Keychain / DPAPI</text>

  <!-- Provider -->
  <rect x="540" y="110" width="300" height="280" rx="12" fill="#E4F7EE" stroke="#5FD0A0"/>
  <text x="690" y="136" text-anchor="middle" font-size="14" font-weight="700" fill="#065F46">Provider（动态库）</text>
  <rect x="570" y="156" width="240" height="70" rx="8" fill="#FFF" stroke="#5FD0A0"/>
  <text x="690" y="181" text-anchor="middle" font-size="12" font-weight="600" fill="#065F46">导出 6 个 C 符号</text>
  <text x="690" y="199" text-anchor="middle" font-size="9.5" fill="#5A9E82">abi_version · descriptor · create</text>
  <text x="690" y="214" text-anchor="middle" font-size="9.5" fill="#5A9E82">request · cancel · destroy</text>
  <rect x="570" y="240" width="240" height="60" rx="8" fill="#FFF" stroke="#5FD0A0"/>
  <text x="690" y="265" text-anchor="middle" font-size="12" font-weight="600" fill="#065F46">两种实现</text>
  <text x="690" y="283" text-anchor="middle" font-size="10" fill="#5A9E82">内置声明式 / 第三方 .dll .so</text>
  <rect x="570" y="314" width="240" height="60" rx="8" fill="#FFF" stroke="#7CA6F5"/>
  <text x="690" y="339" text-anchor="middle" font-size="12" font-weight="600" fill="#1E3A8A">远端题库（可选）</text>
  <text x="690" y="357" text-anchor="middle" font-size="10" fill="#5573A8">HTTP 抓题·异步回包</text>

  <!-- arrows -->
  <path d="M 330 186 L 566 186" stroke="#5B6472" stroke-width="1.8" marker-end="url(#pa)"/>
  <text x="448" y="176" text-anchor="middle" font-size="11" fill="#5B6472">request(JSON)</text>
  <path d="M 566 210 L 330 210" stroke="#059669" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#pa)"/>
  <text x="448" y="228" text-anchor="middle" font-size="11" fill="#059669">callback(JSON) 异步</text>

  <path d="M 566 260 L 334 260" stroke="#7C3AED" stroke-width="1.4" stroke-dasharray="3 2" marker-end="url(#pa)"/>
  <text x="448" y="252" text-anchor="middle" font-size="10" fill="#7C3AED">Provider 反调 Host 存取凭据</text>

  <text x="450" y="428" text-anchor="middle" font-size="11" fill="#9AA3AF">为何用 C ABI 而非 C++ 虚函数：C++ ABI 随编译器变化，C ABI+UTF8 JSON 保证 Host/Provider 可独立编译组合</text>
  <text x="450" y="448" text-anchor="middle" font-size="11" fill="#9AA3AF">struct_size 允许结构末尾追加字段兼容旧插件；abi_version 一致即可加载</text>
</svg>

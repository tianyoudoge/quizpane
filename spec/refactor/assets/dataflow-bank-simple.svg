<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="900" height="560" fill="#FFFFFF"/>
  <text x="450" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1A1A2E">题库创建与识别（简单版）</text>
  <text x="450" y="56" text-anchor="middle" font-size="12" fill="#6B7280">两条链路只在"提取后端"不同，之后共用同一规则引擎与复核 UI</text>

  <defs><marker id="ca" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#059669"/></marker></defs>

  <!-- source -->
  <rect x="350" y="80" width="200" height="54" rx="10" fill="#FEF3E2" stroke="#F7CE8A"/>
  <text x="450" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#B45309">原始资料</text>
  <text x="450" y="123" text-anchor="middle" font-size="10.5" fill="#B98A4A">txt / docx / pdf（+答案册）</text>

  <!-- two extraction paths -->
  <rect x="120" y="170" width="290" height="80" rx="10" fill="#E4F7EE" stroke="#5FD0A0"/>
  <text x="265" y="194" text-anchor="middle" font-size="12.5" font-weight="700" fill="#065F46">链路A · 本地提取（离线）</text>
  <text x="265" y="215" text-anchor="middle" font-size="10.5" fill="#5A9E82">DocumentExtractor</text>
  <text x="265" y="231" text-anchor="middle" font-size="10.5" fill="#5A9E82">PDF 文字层直读 / 扫描页走 OCR</text>

  <rect x="490" y="170" width="290" height="80" rx="10" fill="#E7F0FE" stroke="#7CA6F5"/>
  <text x="635" y="194" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1E3A8A">链路B · 云端提取（可选）</text>
  <text x="635" y="215" text-anchor="middle" font-size="10.5" fill="#5573A8">MinerU 服务解析 PDF → ZIP</text>
  <text x="635" y="231" text-anchor="middle" font-size="10.5" fill="#5573A8">OutputAdapter 适配成同一结构</text>

  <!-- converge -->
  <rect x="300" y="286" width="300" height="52" rx="10" fill="#F3F4F6" stroke="#C0C5CE"/>
  <text x="450" y="309" text-anchor="middle" font-size="12.5" font-weight="700" fill="#374151">ExtractedDocument（统一提取产物）</text>
  <text x="450" y="327" text-anchor="middle" font-size="10" fill="#9AA3AF">纯文本 + 版面锚点 + 按需页面 PNG</text>

  <!-- rule engine -->
  <rect x="300" y="372" width="300" height="60" rx="10" fill="#E4F7EE" stroke="#5FD0A0"/>
  <text x="450" y="396" text-anchor="middle" font-size="12.5" font-weight="700" fill="#065F46">规则引擎 RuleBasedBankGenerator</text>
  <text x="450" y="415" text-anchor="middle" font-size="10.5" fill="#5A9E82">纯离线·确定性：切套→切题→答案→题型→复核分级</text>

  <!-- review result -->
  <rect x="300" y="452" width="300" height="52" rx="10" fill="#F0EBFE" stroke="#B29CF3"/>
  <text x="450" y="475" text-anchor="middle" font-size="12" font-weight="700" fill="#4C1D95">ReviewResult → 复核 UI → 打包</text>
  <text x="450" y="493" text-anchor="middle" font-size="10" fill="#8B7BC4">questions / needsReviewQuestions / materials / assets</text>

  <g stroke="#059669" stroke-width="1.8" marker-end="url(#ca)">
    <path d="M 400 134 L 300 166" fill="none"/>
    <path d="M 500 134 L 600 166" fill="none"/>
    <line x1="265" y1="250" x2="380" y2="284"/>
    <line x1="635" y1="250" x2="520" y2="284"/>
    <line x1="450" y1="338" x2="450" y2="368"/>
    <line x1="450" y1="432" x2="450" y2="448"/>
  </g>

  <text x="450" y="536" text-anchor="middle" font-size="11" fill="#9AA3AF">关键约束：MinerU 是提取后端不是 fallback；不存在"规则失败偷偷调模型"的混合路径</text>
</svg>
